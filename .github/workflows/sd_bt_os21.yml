name: SD OS21 Backtest (RSI21 oversold entry gate)

on:
  workflow_dispatch:
      inputs:
            basket:
description: "عدد رموز الكريبتو"                            default: '40'
                                  rsi21_os:
                                          description: عتبة RSI21
description: "عتبة RSI21"                                                        os_lookback:
                                                                description: نافذة البحث
                                                                        default: '100'
description: "نافذة البحث"                                                                                      description: أقصى بُعد فوق المتوسط
                                                                                              default: '0.06'

description: "أقصى بُعد فوق المتوسط"                                                                                                contents: read

                                                                                                jobs:
                                                                                                  backtest:
                                                                                                      runs-on: ubuntu-latest
                                                                                                          steps:
                                                                                                                - uses: actions/checkout@v4
                                                                                                                      - uses: actions/setup-python@v5
                                                                                                                              with:
                                                                                                                                        python-version: '3.11'
                                                                                                                                              - name: Install deps
                                                                                                                                                      run: pip install requests scikit-learn joblib
                                                                                                                                                            - name: Backtest 15m (context 1h)
                                                                                                                                                                    env:
                                                                                                                                                                              SD_ENTRY_TF: 15m
                                                                                                                                                                                        SD_HTF: 1h
                                                                                                                                                                                                  SD_BASKET: ${{ inputs.basket }}
                                                                                                                                                                                                            SD_RSI21_OS: ${{ inputs.rsi21_os }}
                                                                                                                                                                                                                      SD_OS_LOOKBACK: ${{ inputs.os_lookback }}
                                                                                                                                                                                                                                SD_MAX_EMA_DIST: ${{ inputs.max_ema_dist }}
                                                                                                                                                                                                                                        run: python sd_bt_os21.py 2>&1 | tee -a sd_bt_os21_log.txt
                                                                                                                                                                                                                                              - name: Backtest 1h (context 4h)
                                                                                                                                                                                                                                                      env:
                                                                                                                                                                                                                                                                SD_ENTRY_TF: 1h
                                                                                                                                                                                                                                                                          SD_HTF: 4h
                                                                                                                                                                                                                                                                                    SD_BASKET: ${{ inputs.basket }}
                                                                                                                                                                                                                                                                                              SD_RSI21_OS: ${{ inputs.rsi21_os }}
                                                                                                                                                                                                                                                                                                        SD_OS_LOOKBACK: ${{ inputs.os_lookback }}
                                                                                                                                                                                                                                                                                                                  SD_MAX_EMA_DIST: ${{ inputs.max_ema_dist }}
                                                                                                                                                                                                                                                                                                                          run: python sd_bt_os21.py 2>&1 | tee -a sd_bt_os21_log.txt
                                                                                                                                                                                                                                                                                                                                - name: Upload log artifact
                                                                                                                                                                                                                                                                                                                                        if: always()
                                                                                                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                                                                  name: sd-bt-os21-log
                                                                                                                                                                                                                                                                                                                                                                            path: sd_bt_os21_log.txt
                                                                                                                                                                                                                                                                                                                                                                                      if-no-files-found: ignore
