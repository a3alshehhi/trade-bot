name: reversal-live

# تنبيه حيّ لاستراتيجيات الانعكاس على تيليجرام، فور إغلاق الشمعة.
# كل 15 دقيقة (دقائق 8/23/38/53 لتجنّب ذروة GitHub عند رأس الساعة).
# يشمل: زخم RSI70 (15m/1h) + استراتيجية trendwave المستقلة (15m/1h).
# ⛔ فريم 4h معطّل بطلب بو محمد (2026-07-02) — لإعادة تفعيله أزل التعليق عن أسطر 4h أدناه.
# هذا هو الوركفلو الذي يشغّله cron-job.org، فإضافة trendwave هنا تربطه بالجدولة تلقائياً.
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# يمنع تصادم تشغيلين عند حفظ حالة منع التكرار
concurrency:
  group: repo-state           # موحّدة مع sd_bot/hunter — تسلسل دفعات git لتفادي ضياع الحالة
  cancel-in-progress: false

jobs:
  reversal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run live reversal scans
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── تنفيذ آلي تجريبي على Bybit Testnet لكل البوتات (عبر trackmon) ──
          # يتفعّل فقط بإضافة السرّين. testnet إجباري (لا mainnet بلا SD_ALLOW_MAINNET=1).
          # SD_LABELS يحدّد أي بوتات تُنفَّذ ("*"=الكل). مثال لتقييد: "العرض/الطلب,trendwave"
          SD_EXECUTE: "1"
          BYBIT_ENV: testnet
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          # Bybit يحجب IP أمريكا (خوادم GitHub) — عند إنشاء بروكسي خاص ضع رابطه في هذا السر
          BYBIT_BASE_URL: ${{ secrets.BYBIT_BASE_URL }}
          # ── Binance Spot Demo Mode (التنفيذ المزدوج مع بايبت) ──
          # مفاتيح من demo.binance.com. البروكسي نفسه لكن بمسار /binance:
          # BINANCE_BASE_URL = https://<proj>.vercel.app/binance
          BINANCE_ENV: demo
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_BASE_URL: ${{ secrets.BINANCE_BASE_URL }}
          SD_LABELS: "*"
        run: |
          # إشارة شراء بالزخم: فور تجاوز RSI(21) خط الـ70 — على 4 فريمات
          # --ml-filter: يرشّح الإشارات بالفلتر التعلّمي إن وُجد ml_model.joblib (وإلا يمرّر الكل)
          # === عتبة اختراق RSI مختلفة لكل فريم (2026-07-03): 1h=50 ، 15m=60 ===
          # --rsi-ob-max 78: يرفض الاختراقات التي قفز فيها RSI بعيداً (مثلاً 64→86)
          # الشرط #2: لا يُعاد الدخول لنفس العملة إلا بعد تصحيح ≥38.2% للموجة السابقة (داخلياً)
          # بوابة حداثة اختراق MA200 مفعّلة داخلياً لكل فريم
          # python trading_bot.py --mode reversal --rsi-cross --rsi-ob 60 --rsi-ob-max 78 --ml-filter --watchlist watchlist.txt \
            # --timeframe 15m --state reversal_alerts.json
          # python trading_bot.py --mode reversal --rsi-cross --rsi-ob 50 --rsi-ob-max 78 --ml-filter --watchlist watchlist.txt \
            # --timeframe 1h --state reversal_alerts.json
          # ⛔ 4h معطّل (2026-07-02):
          # python trading_bot.py --mode reversal --rsi-cross --rsi-ob 50 --rsi-ob-max 78 --ml-filter --watchlist watchlist.txt \
          #   --timeframe 4h --state reversal_alerts.json
          # === استراتيجية trendwave المستقلة (الإعداد الرابح) — على نفس الجدول ===
          # دخول مباشر بعد موجة RSI(20→80) + فلتر اتجاه من فريم أعلى. رسائل مُعنونة "trendwave".
          # python trading_bot.py --mode reversal --trendwave --ml-filter --watchlist watchlist.txt \
            # --timeframe 15m --state trendwave_alerts.json
          # python trading_bot.py --mode reversal --trendwave --ml-filter --watchlist watchlist.txt \
            # --timeframe 1h --state trendwave_alerts.json
          # ⛔ 4h معطّل (2026-07-02):
          # python trading_bot.py --mode reversal --trendwave --ml-filter --watchlist watchlist.txt \
          #   --timeframe 4h --state trendwave_alerts.json
          # مسح العرض/الطلب 15m — مُدمج هنا ليعمل كل 15د عبر cron-job.org (جدولة GitHub لـ*/15 غير موثوقة)
          # SD_REQUIRE_MACD4C=1: فلتر زخم MACD 4C≥1 (الأفضل بالباك-تست 2026-07-06). النمط/DCA/EMA365 تُشتق من الفريم.
          SD_ENTRY_TF=15m SD_HTF=1h SD_REQUIRE_MACD4C=1 SD_MODEL=sd_model_15m.joblib SD_STATE=sd_state_15m.json python sd_bot.py
          # متابعة الإشارات المُرسَلة والرد على رسالتها عند بلوغ هدف/وقف
          # (المصدر الوحيد للمتابعة: سياسة هدف أول/وقف فقط، بفيبوناتشي ومتوسط الدخول الصحيح)
          python trading_bot.py --mode trackmon

      # ملاحظة: أُزيلت خطوة paper.py (auto/poll/monitor) لأنها كانت تتابع نفس الصفقات
      # بسياسة قديمة مهجورة (تعادل + تتبّع + دخول مفرد) وتتعارض مع trackmon.

      - name: Persist alert & paper state
        run: |
          for f in reversal_alerts.json trendwave_alerts.json pending_signals.json tracked_signals.json \
                   paper_trades.json tg_offset.json paper_data.json \
                   sd_state_15m.json sd_model_15m.joblib \
                   sd_positions.json sd_ledger.json sd_executed.json sd_last_entry.json \
                   sd_positions_binance.json sd_ledger_binance.json sd_executed_binance.json sd_last_entry_binance.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name "trade-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "update reversal + paper trades [skip ci]"
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::persist push failed after retries — STATE NOT SAVED"; exit 1; }
          fi
