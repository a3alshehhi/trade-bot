name: SD Bot — العرض/الطلب (15m + 1h + 5m كل ربع ساعة)

# ══════════════════════════════════════════════════════════════════════════
# وركفلو واحد موحّد لبوت العرض/الطلب + بوتين تجريبيين (كاتب واحد على الحالة).
#   • البوت الرئيسي (بدّل بالكامل 2026-07-17، طلب بو محمد): استراتيجية «الفيواب الأسبوعي»
#     على 15m فقط: تشبّع RSI21≤20 → اختراق الفيواب الأسبوعي + RSI21≥80 → تحوّل MACD4C
#     للأحمر → دخول DCA بانتظار مستويات فيبو التصحيح · وقف قاع الموجة · أهداف 1.272/1.618.
#     (أُلغيت الشروط القديمة كلها: مناطق العرض/الطلب، CHoCH، ML، بوابة الحجم، مسح 1h.)
#   • بوت تجريبي 1: «زخم سيولة الحيتان» = Whale Liquidity Momentum (15m · إشارات فقط · بلا ML/تنفيذ)
#     نافذة ذهبية: كنس سيولة → قاعدة هادئة → اختراق مصغّر بحجم معتدل فوق الفيواب · رفض توزيع/مطاردة.
#   • بوت تجريبي 2: «عرض/طلب+دايفرجنس» = SMA50 + دايفرجنس صعودي MACD (بلا ML) — 15m + 1h + 5m.
# كل بوت باسم/وسم مختلف، وحالة منفصلة، ودفتر تنفيذ منفصل (Bybit Testnet + Binance Demo).
# التنفيذ testnet/demo فقط — لا mainnet (محميّ داخل sd_autotrade). البوتان التجريبيان
# غير حاسمَين: فشلهما لا يوقف الرئيسي ولا يمنع حفظ الحالة.
# منع التكرار داخل sd_bot.py (sd_state_*.json) يضمن عدم تكرار نفس الإشارة.
# ⛔ بوتا reversal/hunter يبقيان موقوفَين (بطلب بو محمد 2026-07-05).
# ✅ 2026-07-14: تفعيل 3 بوتات trendwave ورقية (بطلب بو محمد):
#   TW-A: 4h vwap_w · TW-B: 4h vwap_m · TW-C: 1h volz+MA200 — كلها hl_gate+rsi60.
#   المسح عند إغلاق الشمعة (4h/1h)، والإدارة والتنفيذ (testnet/demo) كل 15 دقيقة
#   بإدارة 5050 + قفل 0.3R + تعادل بعد العمولتين + أرضية الوقف=الدخول.
on:
  schedule:
    - cron: '8,23,38,53 * * * *'   # احتياطي فقط (جدولة GitHub متقلّبة) — المصدر الأساسي cron-job.org
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  sd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run SD scans (main + 2 experimental) + trackmon
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MIN_TP1_PCT: "1.3"
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── تنفيذ آلي تجريبي (Bybit Testnet + Binance Demo) ──
          SD_EXECUTE: "1"
          BYBIT_ENV: testnet
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_BASE_URL: ${{ secrets.BYBIT_BASE_URL }}
          BINANCE_ENV: demo
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_BASE_URL: ${{ secrets.BINANCE_BASE_URL }}
        run: |
          set -e
          # التقاط وقت بدء الخطوة الآن (قبل المسوح الطويلة) — تستخدمه بوابة مسح trendwave أدناه.
          # لولاه لقُيّمت الدقيقة بعد ~20 دقيقة من المسوح فتُتخطى مسوح trendwave دائماً.
          MIN=$(date -u +%M); HOUR=$(date -u +%H)
          # ══ البوت الرئيسي: استراتيجية «الفيواب الأسبوعي» (2026-07-17) — 15m فقط ══
          # تشبّع RSI21≤20 (لمسة+) → اختراق الفيواب الأسبوعي → RSI21≥80 → تحوّل MACD4C للأحمر
          # → إشارة DCA بانتظار مستويات فيبو (بلا شراء فوري) · وقف قاع الموجة · أهداف 1.272/1.618
          SD_STRATEGY=vwap_wave SD_ENTRY_TF=15m SD_STATE=sd_state_15m.json python sd_bot.py scan
          # تنفيذ + متابعة الرئيسي (وسمه فقط) + لوحة المتتبّع
          SD_LABELS="العرض/الطلب" python trading_bot.py --mode trackmon

          # ══ البوتان التجريبيان (غير حاسمَين: فشلهما لا يوقف الرئيسي) ══
          set +e

          # ── بوت 1: «زخم سيولة الحيتان» — Whale Liquidity Momentum (15m · إشارات فقط) ──
          # مبني على whale_liquidity_momentum_strategy.md (2026-07-20):
          #   نافذة ذهبية = كنس سيولة → قاعدة هادئة → اختراق مصغّر بحجم معتدل (×3-9 القاعدة)
          #   فوق الفيواب الأسبوعي/الشهري + OBV صاعد + MACD4C أخضر. رفض قمة التوزيع (Pattern B)
          #   والمطاردة (حجم >×15 أو MFI4س>85) والسوق الرقيق. بلا ML وبلا تنفيذ آلي (إشارات فقط).
          #   فريم القرار 15m دائماً؛ سياق MFI من 4h. تصنيف الحجم على «قاعدة هادئة» (لا نافذة تشمل الانفجار).
          # دفتر تتبّع معزول (tracked_signals_whale.json يطابق نمط لوحة المتتبّع) لقياس أدائه لحاله
          export SD_LABEL="زخم سيولة الحيتان" SD_TRACK=tracked_signals_whale.json
          SD_STRATEGY=whale SD_ENTRY_TF=15m SD_STATE=sd_state_whale_15m.json python sd_bot.py scan
          # متابعة إشارات الحوت (ورقي فقط — بلا تنفيذ) — إدارة 50/50 + قفل 0.3R + رد تيليجرام + تحديث اللوحة
          SD_TRACK=tracked_signals_whale.json python trading_bot.py --mode trackmon
          unset SD_LABEL SD_TRACK

          # ── بوت 2: «عرض/طلب+دايفرجنس» — SMA50 + دايفرجنس صعودي MACD يتكوّن تحت SMA50 · بلا ML · بلا MACD4C ──
          # SD_MAX_CHASE_R=0.3: حارس الملاحقة — تخطّي الدخول إن تجاوز السعر الدخول بأكثر من 0.3R
          # (يمنع دخولات مطاردة الاختراق السيّئة مثل ANKR). مفعّل لهذا البوت فقط.
          export SD_LABEL="عرض/طلب+دايفرجنس" SD_TREND_MA=sma50 SD_REQUIRE_DIV=1 \
                 SD_REQUIRE_MACD4C=0 SD_ML_THRESHOLD=0 SD_MAX_CHASE_R=0.3
          SD_ENTRY_TF=15m SD_HTF=1h SD_MODEL=sd_model_15m.joblib SD_STATE=sd_state_div_15m.json python sd_bot.py
          SD_ENTRY_TF=1h  SD_HTF=4h  SD_MODEL=sd_model_1h.joblib  SD_STATE=sd_state_div_1h.json  python sd_bot.py
          SD_ENTRY_TF=5m   SD_HTF=15m SD_MODEL=sd_model_15m.joblib SD_STATE=sd_state_div_5m.json  python sd_bot.py
          SD_LABELS="عرض/طلب+دايفرجنس" SD_POS=sd_pos_div.json SD_LEDGER=sd_ledger_div.json \
                 SD_EXECUTED=sd_exec_div.json SD_LAST_ENTRY=sd_last_div.json python sd_autotrade.py run
          unset SD_LABEL SD_TREND_MA SD_REQUIRE_DIV SD_REQUIRE_MACD4C SD_ML_THRESHOLD SD_MAX_CHASE_R

          # ══ بوتات trendwave الورقية الثلاثة (2026-07-14) — غير حاسمة ══
          # الإعدادات الفائزة بالباك-تست: hl_gate + rsi60 (+vwap على 4h، +volz على 1h)
          export TW_HL_GATE=1 TW_RSI_MIN=60
          # MIN/HOUR التُقطا في بداية الخطوة (قبل المسوح الطويلة)
          if [ "$MIN" -lt 15 ]; then
            # أول تشغيلة كل ساعة → مسح 1h (TW-C: volz + MA200)
            TW_TAG=std TW_VOLZ=1.5 SD_TRACK=tw_track_1h.json \
              python trading_bot.py --mode reversal --trendwave --watchlist watchlist.txt \
              --assets crypto --timeframe 1h --state tw_state_1h.json || true
            if [ $((10#$HOUR % 4)) -eq 0 ]; then
              # أول تشغيلة بعد إغلاق شمعة 4h → مسح TW-A وTW-B
              TW_TAG=vwap_w TW_TREND=vwap_w SD_TRACK=tw_track_vwapw.json \
                python trading_bot.py --mode reversal --trendwave --watchlist watchlist.txt \
                --assets crypto --timeframe 4h --state tw_state_vwapw.json || true
              TW_TAG=vwap_m TW_TREND=vwap_m SD_TRACK=tw_track_vwapm.json \
                python trading_bot.py --mode reversal --trendwave --watchlist watchlist.txt \
                --assets crypto --timeframe 4h --state tw_state_vwapm.json || true
            fi
          fi
          # إدارة + تنفيذ (testnet/demo) للبوتات الثلاثة كل 15 دقيقة — دفاتر معزولة
          # (5050 + قفل 0.3R + تعادل حقيقي بعد العمولتين + أرضية الوقف=الدخول داخل sd_autotrade)
          SD_TRACK=tw_track_1h.json SD_LABELS="trendwave · 1h · std" \
            SD_POS=tw_pos_1h.json SD_LEDGER=tw_ledger_1h.json \
            SD_EXECUTED=tw_exec_1h.json SD_LAST_ENTRY=tw_last_1h.json \
            python trading_bot.py --mode trackmon || true
          SD_TRACK=tw_track_vwapw.json SD_LABELS="trendwave · 4h · vwap_w" \
            SD_POS=tw_pos_vwapw.json SD_LEDGER=tw_ledger_vwapw.json \
            SD_EXECUTED=tw_exec_vwapw.json SD_LAST_ENTRY=tw_last_vwapw.json \
            python trading_bot.py --mode trackmon || true
          SD_TRACK=tw_track_vwapm.json SD_LABELS="trendwave · 4h · vwap_m" \
            SD_POS=tw_pos_vwapm.json SD_LEDGER=tw_ledger_vwapm.json \
            SD_EXECUTED=tw_exec_vwapm.json SD_LAST_ENTRY=tw_last_vwapm.json \
            python trading_bot.py --mode trackmon || true
          unset TW_HL_GATE TW_RSI_MIN
          true

      - name: Persist state (conflict-proof)
        run: |
          FILES="sd_state_15m.json sd_state_1h.json sd_model_15m.joblib sd_model_1h.joblib \
                 tracked_signals.json pending_signals.json tg_offset.json paper_data.json \
                 sd_positions.json sd_ledger.json sd_executed.json sd_last_entry.json \
                 sd_positions_binance.json sd_ledger_binance.json sd_executed_binance.json sd_last_entry_binance.json \
                 sd_state_whale_15m.json tracked_signals_whale.json \
                 sd_state_div_15m.json sd_state_div_1h.json sd_state_div_5m.json \
                 sd_pos_div.json sd_ledger_div.json sd_exec_div.json sd_last_div.json \
                 sd_pos_div_binance.json sd_ledger_div_binance.json sd_exec_div_binance.json sd_last_div_binance.json \
                 tw_state_1h.json tw_state_vwapw.json tw_state_vwapm.json \
                 tw_track_1h.json tw_track_vwapw.json tw_track_vwapm.json \
                 tw_pos_1h.json tw_ledger_1h.json tw_exec_1h.json tw_last_1h.json \
                 tw_pos_1h_binance.json tw_ledger_1h_binance.json tw_exec_1h_binance.json tw_last_1h_binance.json \
                 tw_pos_vwapw.json tw_ledger_vwapw.json tw_exec_vwapw.json tw_last_vwapw.json \
                 tw_pos_vwapw_binance.json tw_ledger_vwapw_binance.json tw_exec_vwapw_binance.json tw_last_vwapw_binance.json \
                 tw_pos_vwapm.json tw_ledger_vwapm.json tw_exec_vwapm.json tw_last_vwapm.json \
                 tw_pos_vwapm_binance.json tw_ledger_vwapm_binance.json tw_exec_vwapm_binance.json tw_last_vwapm_binance.json"
          for f in $FILES; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no state changes to persist"; exit 0
          fi
          git config user.name "trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "update SD state [skip ci]"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main; then
              :
            else
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ -n "$conflicts" ]; then
                for c in $conflicts; do git checkout --theirs -- "$c" && git add "$c"; done
                GIT_EDITOR=true git rebase --continue || { git rebase --abort 2>/dev/null || true; sleep 3; continue; }
              else
                git rebase --abort 2>/dev/null || true; sleep 3; continue
              fi
            fi
            if git push; then ok=1; break; fi
            echo "push attempt $i failed, retrying..."; sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::persist push failed after retries — STATE NOT SAVED"; exit 1; }
