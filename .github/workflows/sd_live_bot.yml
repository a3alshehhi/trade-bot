name: SD Live Bot - EMA200 Auto Signals

on:
  schedule:
    # يعمل كل ساعة في 00 دقيقة
    - cron: '0 * * * *'
  
  # يمكنك تشغيله يدويا من GitHub
  workflow_dispatch:

jobs:
  scan-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn joblib yfinance
      
      - name: Run SD Live Bot - EMA200
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🚀 بدء فحص العملات..."
          python3 sd_live_ema200.py
      
      - name: Handle errors gracefully
        if: failure()
        run: |
          echo "⚠️ حدث خطأ في البوت، سيحاول مرة أخرى في الساعة القادمة"
          exit 0
