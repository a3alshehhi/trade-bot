name: SD Trend-Filter Backtest (current vs EMA200 vs SMA200)

# باك-تست مقارنة فلتر الاتجاه لبوت العرض/الطلب (طلب بو محمد 2026-07-07).
# يشغّل sd_bt_trend.py على الفريمين (15m سياق 1h، 1h سياق 4h) ويقارن على نفس الصفقات:
#   الحالي (EMA365/EMA200) · EMA200 · SMA200 — حافة خام بلا ML لعزل أثر المتوسط وحده.
# يُشغَّل يدوياً من تبويب Actions؛ التقرير يُطبع في السجل ويُرفع كـ artifact.

on:
  workflow_dispatch:
    inputs:
      basket:
        description: "عدد رموز الكريبتو من القائمة (سرعة مقابل حجم العيّنة)"
        default: "40"
      max_ema_dist:
        description: "أقصى بُعد فوق المتوسط للدخول (0 = تعطيل قيد القرب)"
        default: "0.06"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests scikit-learn joblib

      - name: Backtest 15m (context 1h)
        env:
          SD_ENTRY_TF: "15m"
          SD_HTF: "1h"
          SD_BASKET: ${{ inputs.basket }}
          SD_MAX_EMA_DIST: ${{ inputs.max_ema_dist }}
        run: python sd_bt_trend.py 2>&1 | tee -a sd_bt_trend_log.txt

      - name: Backtest 1h (context 4h)
        env:
          SD_ENTRY_TF: "1h"
          SD_HTF: "4h"
          SD_BASKET: ${{ inputs.basket }}
          SD_MAX_EMA_DIST: ${{ inputs.max_ema_dist }}
        run: python sd_bt_trend.py 2>&1 | tee -a sd_bt_trend_log.txt

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd-bt-trend-log
          path: sd_bt_trend_log.txt
          if-no-files-found: ignore
