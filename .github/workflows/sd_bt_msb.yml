name: SD MSB Backtest (internal structure break as faster entry trigger)

on:
  workflow_dispatch:
    inputs:
      basket:
        description: "عدد رموز الكريبتو"
        default: '40'
      msb_pivl:
        description: "بنية داخلية — pivL"
        default: '1'
      msb_pivr:
        description: "بنية داخلية — pivR"
        default: '1'
      max_ema_dist:
        description: "أقصى بُعد فوق المتوسط"
        default: '0.06'
      trend_ma:
        description: "فلتر الاتجاه"
        type: choice
        default: 'sma50'
        options:
          - live
          - sma50
          - sma100
          - sma200
          - ema50
          - ema100
          - ema200

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests scikit-learn joblib
      - name: MSB backtest 15m (context 1h)
        env:
          SD_ENTRY_TF: 15m
          SD_HTF: 1h
          SD_BASKET: ${{ inputs.basket }}
          SD_MSB_PIVL: ${{ inputs.msb_pivl }}
          SD_MSB_PIVR: ${{ inputs.msb_pivr }}
          SD_MAX_EMA_DIST: ${{ inputs.max_ema_dist }}
          SD_TREND_MA: ${{ inputs.trend_ma }}
        run: python sd_bt_msb.py 2>&1 | tee -a sd_bt_msb_log.txt
      - name: MSB backtest 1h (context 4h)
        env:
          SD_ENTRY_TF: 1h
          SD_HTF: 4h
          SD_BASKET: ${{ inputs.basket }}
          SD_MSB_PIVL: ${{ inputs.msb_pivl }}
          SD_MSB_PIVR: ${{ inputs.msb_pivr }}
          SD_MAX_EMA_DIST: ${{ inputs.max_ema_dist }}
          SD_TREND_MA: ${{ inputs.trend_ma }}
        run: python sd_bt_msb.py 2>&1 | tee -a sd_bt_msb_log.txt
      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd-bt-msb-log
          path: sd_bt_msb_log.txt
          if-no-files-found: ignore
