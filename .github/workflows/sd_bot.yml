name: SD Bot 1h (AI Supply/Demand signals)

on:
  workflow_dispatch:          # تشغيل يدوي / cron-job.org
  schedule:
    - cron: "7 * * * *"       # كل ساعة (الدقيقة 7 لتفادي ازدحام رأس الساعة) — يناسب شموع 1h

permissions:
  contents: write             # للسماح بحفظ حالة منع التكرار

concurrency:
  group: sd-bot-1h
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests scikit-learn joblib

      - name: Run SD bot — فريم 1h فقط (اختراق قمة CHoCH · سياق 4h)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # فريم 15m انتقل لوركفلو مستقل (sd_bot_15m.yml) كل 15 دقيقة لتفادي تفويت الإشارات.
          # ⛔ فريم 4h معطّل (2026-07-02) — يبقى سياقاً أعلى لـ1h فقط.
          # SD_REQUIRE_MACD4C=1: فلتر زخم MACD 4C≥1 (أخضر) — الأفضل في الباك-تست المعزول 2026-07-06
          SD_ENTRY_TF=1h SD_HTF=4h SD_REQUIRE_MACD4C=1 SD_MODEL=sd_model_1h.joblib SD_STATE=sd_state_1h.json python sd_bot.py

      - name: Persist model + dedup state + tracked signals
        run: |
          # tracked_signals.json مشترك: نضيف إشاراتنا فقط، ونعيد المزامنة بـ rebase.
          for f in sd_state_1h.json sd_model_1h.joblib tracked_signals.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "update sd 1h state + tracked signals [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
