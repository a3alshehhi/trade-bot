name: Hunter Backtest (باك-تست حقيقي على بيانات فعلية)

on:
  workflow_dispatch:
    inputs:
      tf:
        description: "فريم الدخول (15m / 1h / 4h)"
        default: "15m"
      htf:
        description: "السياق الأعلى (1h / 4h / 1d)"
        default: "1h"
      min_score:
        description: "أدنى درجة (0..5)"
        default: "4"
      vol_z:
        description: "فوليوم الدخول (Volume Z على شمعة الدخول)"
        default: "3"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Run backtest (بيانات Binance الحقيقية)
        env:
          HUNTER_TF: ${{ github.event.inputs.tf }}
          HUNTER_HTF: ${{ github.event.inputs.htf }}
          HUNTER_MIN_SCORE: ${{ github.event.inputs.min_score }}
          HUNTER_VOL_Z: ${{ github.event.inputs.vol_z }}
        run: |
          python hunter_bot.py backtest | tee hunter_backtest_result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hunter-backtest-result
          path: hunter_backtest_result.txt
