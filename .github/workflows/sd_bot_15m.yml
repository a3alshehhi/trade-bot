name: SD Bot 15m (AI Supply/Demand signals)

on:
  workflow_dispatch:          # يدوي/احتياطي فقط — المسح كل 15د انتقل إلى reversal.yml (يضربه cron-job.org بدقّة)
  # ⛔ جدولة GitHub لـ*/15 معطّلة (2026-07-06): كانت تُشغّل كل 1–4 ساعات فقط بسبب throttling.
  #    مسح الـ15m صار مُدمجاً في reversal.yml. لإعادة التفعيل أزِل التعليق أدناه.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: write             # للسماح بحفظ حالة منع التكرار

concurrency:
  group: sd-bot-15m           # مجموعة مستقلّة عن 1h (ملف حالة منفصل — لا تزاحم)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests scikit-learn joblib

      - name: Run SD bot — فريم 15m فقط (اختراق قمة CHoCH + توسيط DCA · EMA365 · سياق 1h)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # النمط والفلاتر (اختراق + DCA + EMA365) تُشتق تلقائياً من SD_ENTRY_TF=15m داخل sd_bot.py
          # SD_REQUIRE_MACD4C=1: فلتر زخم MACD 4C≥1 (أخضر) — الأفضل في الباك-تست المعزول 2026-07-06
          SD_ENTRY_TF=15m SD_HTF=1h SD_REQUIRE_MACD4C=1 SD_MODEL=sd_model_15m.joblib SD_STATE=sd_state_15m.json python sd_bot.py

      - name: Persist model + dedup state + tracked signals
        run: |
          # tracked_signals.json مشترك: نضيف إشاراتنا فقط، ونعيد المزامنة بـ rebase.
          for f in sd_state_15m.json sd_model_15m.joblib tracked_signals.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "update sd 15m state + tracked signals [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
