name: SD Stable — عرض/طلب مستقر (كل 15د)

on:
  schedule:
    - cron: '*/15 * * * *'  # كل 15 دقيقة
  workflow_dispatch:  # تشغيل يدوي

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install ccxt binance-connector pybit requests

      - name: Run SD Stable (إدارة المراكز فقط)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── إعدادات Bybit Testnet ──
          SD_EXECUTE: "1"
          BYBIT_ENV: testnet
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_BASE_URL: ${{ secrets.BYBIT_BASE_URL }}
          # ── إعدادات Binance Demo ──
          BINANCE_ENV: demo
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_BASE_URL: ${{ secrets.BINANCE_BASE_URL }}
          # ── ملفات الحالة المنفصلة (تجنب تضارب مع البوت الرئيسي) ──
          SD_POS: sd_positions_stable.json
          SD_LEDGER: sd_ledger_stable.json
          SD_EXECUTED: sd_executed_stable.json
          SD_LAST_ENTRY: sd_last_entry_stable.json
          SD_TRACK: tracked_signals_stable.json
        run: |
          # تشغيل الإدارة فقط (تنفيذ الصفقات المفتوحة)
          python sd_autotrade_stable.py manage

      - name: Persist stable state
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --cached --quiet || git commit -m "update SD Stable state [skip ci]" || true
          git push || true
