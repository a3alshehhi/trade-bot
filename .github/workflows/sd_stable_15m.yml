name: SD Stable - عرض/طلب مستقر (كل 15د)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run SD Stable
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SD_EXECUTE: "1"
          BYBIT_ENV: testnet
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_BASE_URL: ${{ secrets.BYBIT_BASE_URL }}
          BINANCE_ENV: demo
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_BASE_URL: ${{ secrets.BINANCE_BASE_URL }}
          SD_POS: sd_positions_stable.json
          SD_LEDGER: sd_ledger_stable.json
          SD_EXECUTED: sd_executed_stable.json
          SD_LAST_ENTRY: sd_last_entry_stable.json
          SD_TRACK: tracked_signals_stable.json
          SD_LABEL: "SD Stable"
        run: |
          SD_ENTRY_TF=15m SD_HTF=1h SD_MODEL=sd_model_15m.joblib SD_STATE=sd_state_stable_15m.json python sd_bot.py
          SD_ENTRY_TF=1h SD_HTF=4h SD_MODEL=sd_model_1h.joblib SD_STATE=sd_state_stable_1h.json python sd_bot.py
          SD_LABELS="SD Stable" python sd_autotrade_stable.py run
          SD_LABELS="SD Stable" python trading_bot.py --mode trackmon

      - name: Persist stable state (conflict-proof)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          FILES="sd_state_stable_15m.json sd_state_stable_1h.json sd_model_15m.joblib sd_model_1h.joblib \
                 sd_positions_stable.json sd_ledger_stable.json sd_executed_stable.json sd_last_entry_stable.json \
                 tracked_signals_stable.json pending_signals.json tg_offset.json paper_data.json"
          for f in $FILES; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no state changes to persist"; exit 0
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit -m "update SD Stable state [skip ci]"
          REMOTE="https://${GH_TOKEN}@github.com/a3alshehhi/trade-bot.git"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch "$REMOTE" main
            if git rebase FETCH_HEAD; then
              :
            else
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ -n "$conflicts" ]; then
                for c in $conflicts; do git checkout --theirs -- "$c" && git add "$c"; done
                GIT_EDITOR=true git rebase --continue || { git rebase --abort 2>/dev/null || true; sleep 3; continue; }
              else
                git rebase --abort 2>/dev/null || true; sleep 3; continue
              fi
            fi
            if git push "$REMOTE" HEAD:main; then ok=1; break; fi
            echo "push attempt $i failed, retrying..."; sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::persist push failed after retries — STATE NOT SAVED"; exit 1; }
