name: SD Reconcile (account vs tracker)

# مطابقة أرصدة بايبت/بايننس الفعلية بملف مراكز «SD Stable» وإرسال رسالة المطابقة لتيليجرام.
#  الجدولة اليومية (schedule) = وضع apply: تزيل الوهمية وتبلّغ عن اليتيمة وترسل الرسالة مرة واحدة 9 مساءً بتوقيت الإمارات.
#  التشغيل اليدوي (workflow_dispatch): report=تقرير فقط · apply=إزالة الوهمية.
#  ملاحظة: التنظيف المتكرّر كل 15 دقيقة يجري داخل sd_stable_15m.yml بصمت (SD_RECON_QUIET=1) بلا رسالة.
on:
  schedule:
    - cron: '0 17 * * *'   # 17:00 UTC = 9 مساءً بتوقيت الإمارات (UTC+4) — رسالة المطابقة اليومية (apply)
  workflow_dispatch:
    inputs:
      mode:
        description: "الوضع (report=تقرير فقط · apply=إزالة الوهمية)"
        type: choice
        options: ["report", "apply"]
        default: "report"

# نفس مجموعة تزامن الحالة — لا يعمل أثناء دورة تكتب المراكز (تفادي تعارض git)
concurrency:
  group: repo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run reconcile (SD Stable — يرسل الرسالة)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SD_EXECUTE: "1"
          BYBIT_ENV: testnet
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_BASE_URL: ${{ secrets.BYBIT_BASE_URL }}
          BINANCE_ENV: demo
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_BASE_URL: ${{ secrets.BINANCE_BASE_URL }}
          SD_POS: sd_positions_stable.json
          SD_LEDGER: sd_ledger_stable.json
          SD_EXECUTED: sd_executed_stable.json
          SD_LAST_ENTRY: sd_last_entry_stable.json
          SD_TRACK: tracked_signals_stable.json
          SD_LABEL: "SD Stable"
          SD_LABELS: "SD Stable"
        run: |
          # الجدولة اليومية = apply؛ التشغيل اليدوي يتبع الاختيار (افتراضي report). بلا SD_RECON_QUIET ⇒ ترسل الرسالة.
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="apply"; fi
          if [ "$MODE" = "apply" ]; then
            python sd_autotrade_stable.py reconcile apply
          else
            python sd_autotrade_stable.py reconcile
          fi

      - name: Persist positions (apply/schedule only)
        if: ${{ inputs.mode == 'apply' || github.event_name == 'schedule' }}
        run: |
          for f in sd_positions_stable.json sd_positions_stable_binance.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name "trade-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "reconcile: drop phantom positions [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
